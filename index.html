<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9FB5C3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="工作台">
  <link rel="manifest" href="manifest.json">
  <title>工作台</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="state.js"></script>
<script src="sync.js"></script>
<script src="helpers.js"></script>
<script src="actions.js"></script>
<script src="render.js"></script>
<script src="events.js"></script>
<script>
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyAppTheme();
renderApp();
// ── 新版偵測：比對核心檔案版本，有更新就跳出提示，點一下清快取並重載 ──
(function(){
  if(!/^https?:/.test(location.protocol))return; // 本機 file:// 不需要
  var FILES=['render.js','styles.css','events.js','actions.js','state.js','helpers.js','sync.js'];
  var base=null,shown=false;
  function sig(){
    return Promise.all(FILES.map(function(f){
      return fetch(f+'?t='+Date.now(),{method:'HEAD',cache:'no-store'})
        .then(function(r){return r.headers.get('etag')||r.headers.get('last-modified')||'';})
        .catch(function(){return'';});
    })).then(function(a){return a.join('|');});
  }
  function bar(){
    if(shown)return;shown=true;
    var d=document.createElement('div');
    d.textContent='🔄 有新版本，點一下更新';
    d.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99999;'
      +'background:#3A2E24;color:#fff;padding:12px 22px;border-radius:999px;font-family:inherit;'
      +'font-size:14px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.3);cursor:pointer';
    d.onclick=function(){
      d.textContent='更新中…';
      var go=function(){location.reload();};
      if(window.caches&&caches.keys)caches.keys()
        .then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));})
        .then(go,go);
      else go();
    };
    document.body.appendChild(d);
  }
  sig().then(function(s){base=s;});
  function check(){if(base&&!shown)sig().then(function(s){if(s&&s!==base)bar();});}
  setInterval(check,120000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();
</script>
</body>
</html>
